<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewer Lab</title>
<meta name="description" content="Laboratorio de café: Brewer Lab para baristas y Farmer Lab para fincas. Bitácora, recetas, cata SCA CVA, escuela de café, diagnóstico de fincas y portal del productor.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#20232A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brewer Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Montserrat:wght@300..700&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:wght@400..700&display=swap" crossorigin="anonymous">
<style>
/* Identidad Selah (Crema, Azul Pausa, Arena, Tinta) con dos ambientes:
   Brewer Lab = 8-bit Selah (letra pixelada, bordes de píxel, sombras duras)
   Farmer Lab y portal del productor = natural (verdes, hojas, formas suaves) */
:root {
  --bg: #FFFFFF; --surface: #F8F6F1; --surface-2: #F0EBE0; --field: #FFFFFF;
  --ink: #20232A; --head: #20232A; --muted: #6B6E75; --line: #ECE6DA; --line-2: #D4C8AE;
  --accent: #20232A; --accent-ink: #FFFFFF; --accent-soft: #FBEBC9;
  --azul: #B7C9D3; --azul-soft: rgba(183, 201, 211, .38);
  --ok: #3E6B55; --ok-soft: #E3ECE5; --warn: #7A5A1E; --warn-soft: #FBEBC9; --bad: #A4423A; --bad-soft: #F6E1DC;
  --shadow: 0 1px 2px rgba(32, 35, 42, .05), 0 10px 30px rgba(32, 35, 42, .07);
  --patron: url("img/patron-crema.svg"); --hero-bg: #FBEBC9;
  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-num: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-px: "Pixelify Sans", "Courier New", monospace;
  --r: 18px;
  --px-tinta: #20232A; --px-crema: #FBEBC9; --px-azul: #B7C9D3; --px-arena: #D4C8AE;
  --f-musgo: #3F5A35; --f-hoja: #6E8F4E; --f-brote: #A9C48A; --f-cereza: #B4443A; --f-tierra: #7A5A43;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #20232A; --surface: #2A2E36; --surface-2: #343843; --field: #24272F; --ink: #F3EEE4; --head: #FBEBC9; --muted: #A9ACB3;
    --line: #363B45; --line-2: #4A505C; --accent: #FBEBC9; --accent-ink: #20232A; --accent-soft: rgba(251, 235, 201, .13);
    --azul-soft: rgba(183, 201, 211, .2); --ok: #8CC5A2; --ok-soft: rgba(140, 197, 162, .15); --warn: #F0D9A8; --warn-soft: rgba(251, 235, 201, .12);
    --bad: #F0A49B; --bad-soft: rgba(240, 164, 155, .15); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .3);
    --patron: url("img/patron-tinta.svg"); --hero-bg: #2A2E36; --px-tinta: #FBEBC9; --px-crema: #343843;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #20232A; --surface: #2A2E36; --surface-2: #343843; --field: #24272F; --ink: #F3EEE4; --head: #FBEBC9; --muted: #A9ACB3;
  --line: #363B45; --line-2: #4A505C; --accent: #FBEBC9; --accent-ink: #20232A; --accent-soft: rgba(251, 235, 201, .13);
  --azul-soft: rgba(183, 201, 211, .2); --ok: #8CC5A2; --ok-soft: rgba(140, 197, 162, .15); --warn: #F0D9A8; --warn-soft: rgba(251, 235, 201, .12);
  --bad: #F0A49B; --bad-soft: rgba(240, 164, 155, .15); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .3);
  --patron: url("img/patron-tinta.svg"); --hero-bg: #2A2E36; --px-tinta: #FBEBC9; --px-crema: #343843;
  color-scheme: dark;
}
/* ---------- Farmer Lab: natural ---------- */
body[data-lab="farmer"] {
  --bg: #F7F4EA; --surface: #EEF2E4; --surface-2: #E2EAD5; --field: #FFFFFF; --ink: #24301F; --head: #24301F; --muted: #5D6B57;
  --line: #DCE5CF; --line-2: #B9C9A6; --accent: #3F5A35; --accent-ink: #FFFFFF; --accent-soft: #E3EED6;
  --azul: #CFE3E8; --azul-soft: rgba(207, 227, 232, .6); --ok: #3F6B3A; --ok-soft: #E1EDD8; --warn: #8A5A1E; --warn-soft: #F6E7C8; --bad: #A5402F; --bad-soft: #F5DED6;
  --hero-bg: #E3EED6; --font-display: "Fraunces", Georgia, serif; --r: 22px;
  --shadow: 0 2px 6px rgba(36, 48, 31, .06), 0 14px 34px rgba(36, 48, 31, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body[data-lab="farmer"] {
    --bg: #141C15; --surface: #1D281E; --surface-2: #26332A; --field: #18211A; --ink: #E7F0DD; --head: #CFE6B7; --muted: #A3B39A;
    --line: #2E3D30; --line-2: #42563F; --accent: #A9C48A; --accent-ink: #14200F; --accent-soft: rgba(169, 196, 138, .15);
    --azul-soft: rgba(207, 227, 232, .14); --ok: #A9D19A; --ok-soft: rgba(169, 209, 154, .14); --warn: #EBC98B; --warn-soft: rgba(235, 201, 139, .14); --bad: #F0A493; --bad-soft: rgba(240, 164, 147, .14);
    --hero-bg: #1D281E;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; transition: background .3s; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; text-wrap: balance; margin: 0; color: var(--head); }
h2 { font-size: 1.55rem; } h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--ink); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.eyebrow { font-size: .68rem; text-transform: uppercase; letter-spacing: .3em; color: var(--muted); font-weight: 500; }
.lede { color: var(--muted); max-width: 62ch; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Estructura ---------- */
.top { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line); transition: background .3s; }
.marca { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; color: var(--head); order: 1; }
.marca b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; white-space: nowrap; }
.marca svg { width: 28px; height: 28px; flex: none; }
.m-brewer, .m-farmer { display: flex; align-items: center; gap: 10px; }
.m-farmer { display: none; }
body[data-lab="farmer"] .m-brewer { display: none; } body[data-lab="farmer"] .m-farmer { display: flex; }
.top-acc { display: flex; gap: 8px; align-items: center; order: 3; }
.labs { order: 2; display: inline-flex; padding: 4px; gap: 4px; background: var(--surface); border-radius: 999px; border: 1px solid var(--line); }
.labs button { border: 0; background: none; border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; transition: background .25s, color .25s; }
.labs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
body[data-rol="productor"] .labs { display: none; }
.icono { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); cursor: pointer; font-weight: 500; font-size: .85rem; }
.icono svg { width: 18px; height: 18px; }
.icono[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.avatar { width: 40px; padding: 0; justify-content: center; font-weight: 700; font-size: 1rem; background: var(--accent-soft); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: .7rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.red { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 500; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
.red::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.red.off { color: var(--warn); } .red.off::before { background: #C9A15A; }
.shell { display: flex; align-items: flex-start; }
.nav { display: flex; gap: 4px; }
.nav button { display: none; align-items: center; gap: 12px; border: 0; background: none; cursor: pointer; border-radius: 999px; padding: 10px 16px; color: var(--muted); font-weight: 500; }
body[data-navlab="brewer"] .nav [data-solo="brewer"], body[data-navlab="farmer"] .nav [data-solo="farmer"], body[data-navlab="productor"] .nav [data-solo="productor"] { display: flex; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
main.wrap { flex: 1; min-width: 0; padding-block: 22px 44px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.contenido { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 900px) {
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); flex-direction: column; width: 210px; padding: 22px 0 22px max(16px, env(safe-area-inset-left, 0px)); flex: none; }
}
@media (max-width: 899px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; background: var(--bg); border-top: 1px solid var(--line);
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .nav button { flex-direction: column; gap: 3px; font-size: .64rem; padding: 6px 2px; flex: 1; min-width: 0; border-radius: 12px; }
  .nav button[aria-current="page"] { background: none; }
  main.wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  .icono { padding: 0 11px; } .icono .txt, .red .txt { display: none; }
  .labs { order: 4; width: 100%; } .labs button { flex: 1; justify-content: center; }
}
@media (max-width: 380px) { .marca b { font-size: 1.2rem; } .top-acc { gap: 6px; } }

/* ---------- Elementos ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); cursor: pointer; font-weight: 500; letter-spacing: .03em; text-align: center; transition: transform .12s, background .2s, border-color .2s; }
.btn:hover { border-color: var(--ink); } .btn:active { transform: scale(.97); }
.btn:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.sm { min-height: 36px; padding: 6px 16px; font-size: .85rem; }
.btn.big { min-height: 54px; padding: 12px 30px; font-size: 1rem; }
.btn.link { border: 0; background: none; color: var(--ink); padding: 4px 0; min-height: 0; text-decoration: underline; text-underline-offset: 4px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: .72rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-family: var(--font-body); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.score { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.score.warn { background: var(--warn-soft); color: var(--warn); } .score.bad { background: var(--bad-soft); color: var(--bad); }
.estrellas { color: var(--accent); letter-spacing: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #C9A15A; display: inline-block; flex: none; }
.aviso { padding: 12px 16px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-weight: 500; font-size: .88rem; }
.aviso.suave { background: var(--azul-soft); color: var(--ink); }
.volver { align-self: flex-start; border: 0; background: none; color: var(--ink); font-weight: 500; cursor: pointer; padding: 4px 0; }
.hero { display: flex; flex-direction: column; gap: 10px; padding: clamp(24px, 4vw, 40px); border-radius: 22px; background: var(--hero-bg) var(--patron) center / 1600px; position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 500; max-width: 18ch; }
.rapidas { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.rapida { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 0; background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; text-align: left; transition: transform .15s, background .2s; }
.rapida svg { width: 36px; height: 36px; padding: 8px; flex: none; color: var(--ink); background: var(--bg); border-radius: 50%; }
.rapida:hover { background: var(--surface-2); transform: translateY(-2px); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border-radius: var(--r); background: var(--surface); border: 0; text-align: left; }
.stat span { font-size: .66rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .2em; }
.stat b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--head); }
.stat small { font-size: .74rem; color: var(--muted); min-height: 1em; }
.dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
.dos > * { min-width: 0; }
.panel { background: var(--surface); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-h h2 { font-size: 1.3rem; }
.barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.barra-acc { display: flex; gap: 8px; flex-wrap: wrap; }
.subtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.subtabs button { border: 1px solid var(--line-2); background: var(--bg); border-radius: 999px; padding: 8px 18px; cursor: pointer; font-weight: 500; white-space: nowrap; color: var(--ink); }
.subtabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filas { display: flex; flex-direction: column; gap: 8px; }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 0; border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer; width: 100%; transition: background .2s, transform .15s; }
.panel .fila, .bloque .fila { background: var(--bg); }
.fila:hover { background: var(--surface-2); }
.fila.estatica { cursor: default; }
.fila-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fila-txt b { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; overflow-wrap: anywhere; color: var(--head); }
.fila-txt small { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
.fila-der { display: flex; align-items: center; gap: 8px; flex: none; }
.vacio { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }
.vacio-t { font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; color: var(--head); }
.cargando { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 0; color: var(--muted); }
.taza { width: 46px; height: 34px; border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 22px 22px; position: relative; flex: none; }
.taza::before { content: ""; position: absolute; left: 12px; top: -18px; width: 4px; height: 12px; border-radius: 4px; background: var(--ink); opacity: .5; animation: vapor 1.4s ease-in-out infinite; }
.taza::after { content: ""; position: absolute; right: -14px; top: 4px; width: 12px; height: 14px; border: 3px solid var(--ink); border-left: 0; border-radius: 0 10px 10px 0; }
@keyframes vapor { 0%, 100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(-6px); opacity: .7; } }

/* ---------- Formularios ---------- */
.form { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border-radius: var(--r); padding: 20px; }
.form details summary { cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.form details ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
fieldset { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--bg); }
legend { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; padding: 0 8px; color: var(--head); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.grid.g3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } .grid.g4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.grid > * { min-width: 0; }
@media (min-width: 700px) { .span2 { grid-column: span 2; } }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label, .fld > span { font-weight: 600; font-size: .66rem; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); }
.fld > label small { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
.help { font-size: .76rem; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="password"], input[type="email"], select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 13px; background: var(--field); font-size: 16px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--azul-soft); }
.segs { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px 20px; }
@media (max-width: 420px) { .segs { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 5px; }
.seg button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--field); cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg-lbl { color: var(--ink); font-weight: 600; margin-left: 4px; text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); background: var(--field); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .84rem; }
.chip[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #20232A; font-weight: 600; }
.chipf { border: 1px solid var(--line-2); background: var(--field); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .84rem; }
.chipf[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- Aprende / escuela ---------- */
.tuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

/* ---------- Granito ---------- */

/* ---------- Luxómetro ---------- */

/* ---------- Sincronización y avisos ---------- */
.sync { display: flex; flex-direction: column; gap: 16px; max-width: 760px; }

.toast.warn { background: var(--warn-soft); color: var(--warn); } .toast.bad { background: var(--bad-soft); color: var(--bad); } .toast.out { opacity: 0; transform: translateY(6px); }

/* ---------- Animación de entrada de cada pantalla ---------- */
#main.entra > * { animation: subir .5s cubic-bezier(.2, .7, .2, 1) both; }
#main.entra > *:nth-child(2) { animation-delay: .04s; } #main.entra > *:nth-child(3) { animation-delay: .08s; } #main.entra > *:nth-child(4) { animation-delay: .12s; }
#main.entra > *:nth-child(5) { animation-delay: .16s; } #main.entra > *:nth-child(6) { animation-delay: .2s; } #main.entra > *:nth-child(n+7) { animation-delay: .24s; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } }

/* =================== Brewer Lab · 8-bit Selah =================== */
