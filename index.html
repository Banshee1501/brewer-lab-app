<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewer Lab</title>
<meta name="description" content="Laboratorio de café: bitácora de preparaciones, recetas, cata SCA CVA, consultoría de fincas y diagnóstico con foto e IA. Funciona sin conexión.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#20232A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brewer Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..700&family=Playfair+Display:wght@400..700&display=swap" crossorigin="anonymous">
<style>
/* Identidad Selah: Crema Selah, Azul Pausa, Arena y Tinta. Playfair Display para títulos, Montserrat para el texto.
   Tarjetas suaves sobre blanco, botones en píldora y el patrón del reloj de arena como textura. */
:root {
  --bg: #FFFFFF;
  --surface: #F8F6F1;      /* tarjetas, como en la tienda Selah */
  --surface-2: #F0EBE0;
  --field: #FFFFFF;        /* campos sobre las tarjetas */
  --ink: #20232A;          /* Tinta */
  --head: #20232A;
  --muted: #6B6E75;
  --line: #ECE6DA;
  --line-2: #D4C8AE;       /* Arena: bordes de botones y opciones */
  --accent: #20232A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBEBC9;  /* Crema Selah */
  --azul: #B7C9D3;         /* Azul Pausa */
  --azul-soft: rgba(183, 201, 211, .38);
  --ok: #3E6B55; --ok-soft: #E3ECE5;
  --warn: #7A5A1E; --warn-soft: #FBEBC9;
  --bad: #A4423A; --bad-soft: #F6E1DC;
  --shadow: 0 1px 2px rgba(32, 35, 42, .05), 0 10px 30px rgba(32, 35, 42, .07);
  --patron: url("img/patron-crema.svg");
  --hero-bg: #FBEBC9;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-num: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #20232A; --surface: #2A2E36; --surface-2: #343843; --field: #24272F; --ink: #F3EEE4; --head: #FBEBC9; --muted: #A9ACB3;
    --line: #363B45; --line-2: #4A505C; --accent: #FBEBC9; --accent-ink: #20232A; --accent-soft: rgba(251, 235, 201, .13);
    --azul-soft: rgba(183, 201, 211, .2); --ok: #8CC5A2; --ok-soft: rgba(140, 197, 162, .15); --warn: #F0D9A8; --warn-soft: rgba(251, 235, 201, .12);
    --bad: #F0A49B; --bad-soft: rgba(240, 164, 155, .15); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .3);
    --patron: url("img/patron-tinta.svg"); --hero-bg: #2A2E36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #20232A; --surface: #2A2E36; --surface-2: #343843; --field: #24272F; --ink: #F3EEE4; --head: #FBEBC9; --muted: #A9ACB3;
  --line: #363B45; --line-2: #4A505C; --accent: #FBEBC9; --accent-ink: #20232A; --accent-soft: rgba(251, 235, 201, .13);
  --azul-soft: rgba(183, 201, 211, .2); --ok: #8CC5A2; --ok-soft: rgba(140, 197, 162, .15); --warn: #F0D9A8; --warn-soft: rgba(251, 235, 201, .12);
  --bad: #F0A49B; --bad-soft: rgba(240, 164, 155, .15); --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .3);
  --patron: url("img/patron-tinta.svg"); --hero-bg: #2A2E36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; text-wrap: balance; margin: 0; color: var(--head); }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--ink); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.eyebrow { font-size: .68rem; text-transform: uppercase; letter-spacing: .3em; color: var(--muted); font-weight: 500; }
.lede { color: var(--muted); max-width: 62ch; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Estructura ---------- */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line); }
.marca { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; color: var(--head); }
.marca b { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.marca svg { width: 28px; height: 28px; flex: none; }
.top-acc { display: flex; gap: 8px; align-items: center; }
.icono { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); cursor: pointer; font-weight: 500; font-size: .85rem; letter-spacing: .03em; }
.icono svg { width: 18px; height: 18px; }
.icono[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: .7rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-num); }
.icono[aria-current="page"] .badge { background: var(--accent-ink); color: var(--accent); }
.red { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 500; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
.red::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.red.off { color: var(--warn); }
.red.off::before { background: #C9A15A; }
.shell { display: flex; align-items: flex-start; }
.nav { display: flex; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; cursor: pointer; border-radius: 999px; padding: 10px 16px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
main.wrap { flex: 1; min-width: 0; padding-block: 22px 44px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.contenido { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 900px) {
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); flex-direction: column; width: 210px; padding: 22px 0 22px max(16px, env(safe-area-inset-left, 0px)); flex: none; }
}
@media (max-width: 899px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; background: var(--bg); border-top: 1px solid var(--line);
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .nav button { flex-direction: column; gap: 3px; font-size: .66rem; padding: 6px 2px; flex: 1; min-width: 0; border-radius: 12px; letter-spacing: .01em; }
  .nav button[aria-current="page"] { background: none; }
  main.wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  .icono { padding: 0 11px; }
  .icono .txt, .red .txt { display: none; }
}
@media (max-width: 380px) { .marca b { font-size: 1.25rem; } .marca { gap: 8px; } .top-acc { gap: 6px; } }

/* ---------- Elementos ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); cursor: pointer; font-weight: 500; letter-spacing: .04em; text-align: center; }
.btn:hover { border-color: var(--ink); }
.btn:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { opacity: .92; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.sm { min-height: 36px; padding: 6px 16px; font-size: .85rem; }
.btn.big { min-height: 54px; padding: 12px 30px; font-size: 1rem; }
.btn.link { border: 0; background: none; color: var(--ink); padding: 4px 0; min-height: 0; text-decoration: underline; text-underline-offset: 4px; letter-spacing: .02em; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: .72rem; font-weight: 600; letter-spacing: .02em; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-family: var(--font-body); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.score { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.score.warn { background: var(--warn-soft); color: var(--warn); } .score.bad { background: var(--bad-soft); color: var(--bad); }
.estrellas { color: var(--accent); letter-spacing: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #C9A15A; display: inline-block; flex: none; }
.aviso { padding: 12px 16px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-weight: 500; font-size: .88rem; }
.aviso.suave { background: var(--azul-soft); color: var(--ink); }
.volver { align-self: flex-start; border: 0; background: none; color: var(--ink); font-weight: 500; cursor: pointer; padding: 4px 0; letter-spacing: .02em; }

.hero { display: flex; flex-direction: column; gap: 10px; padding: clamp(24px, 4vw, 40px); border-radius: 22px; background: var(--hero-bg) var(--patron) center / 1600px; }
.hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 500; letter-spacing: -.01em; max-width: 16ch; }
.hero .lede { color: color-mix(in srgb, var(--ink) 78%, transparent); }
.rapidas { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.rapida { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 0; background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; text-align: left; }
.rapida svg { width: 36px; height: 36px; padding: 8px; flex: none; color: var(--ink); background: var(--bg); border-radius: 50%; }
.rapida:hover { background: var(--surface-2); }
.guia-inicio ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border-radius: var(--r); background: var(--surface); border: 0; text-align: left; }
.stat span { font-size: .66rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .2em; }
.stat b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--head); }
.stat small { font-size: .74rem; color: var(--muted); min-height: 1em; }
.stat-sync { cursor: pointer; background: var(--accent-soft); }
.dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
.dos > * { min-width: 0; }
.panel { background: var(--surface); border: 0; border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-h h2 { font-size: 1.3rem; }
.barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.barra-acc { display: flex; gap: 8px; flex-wrap: wrap; }
.subtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.subtabs button { border: 1px solid var(--line-2); background: var(--bg); border-radius: 999px; padding: 8px 18px; cursor: pointer; font-weight: 500; white-space: nowrap; color: var(--ink); letter-spacing: .02em; }
.subtabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.filas { display: flex; flex-direction: column; gap: 8px; }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 0; border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer; width: 100%; }
.panel .fila, .bloque .fila { background: var(--bg); }
.fila:hover { background: var(--surface-2); }
.fila.estatica { cursor: default; }
.fila-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fila-txt b { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; overflow-wrap: anywhere; color: var(--head); }
.fila-txt small { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
.fila-der { display: flex; align-items: center; gap: 8px; flex: none; }
.vacio { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); background: transparent; }
.vacio-t { font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; color: var(--head); }
.cargando { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 0; color: var(--muted); }
.taza { width: 46px; height: 34px; border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 22px 22px; position: relative; flex: none; }
.taza::before { content: ""; position: absolute; left: 12px; top: -18px; width: 4px; height: 12px; border-radius: 4px; background: var(--ink); opacity: .5; animation: vapor 1.4s ease-in-out infinite; }
.taza::after { content: ""; position: absolute; right: -14px; top: 4px; width: 12px; height: 14px; border: 3px solid var(--ink); border-left: 0; border-radius: 0 10px 10px 0; }
@keyframes vapor { 0%, 100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(-6px); opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .taza::before { animation: none; } }

/* ---------- Formularios ---------- */
.form { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border: 0; border-radius: var(--r); padding: 20px; }
.form details summary { cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.form details ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
fieldset { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--bg); }
legend { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; padding: 0 8px; color: var(--head); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.grid.g3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid.g4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.grid > * { min-width: 0; }
@media (min-width: 700px) { .span2 { grid-column: span 2; } }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label { font-weight: 600; font-size: .66rem; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); }
.fld > label small { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
.help { font-size: .76rem; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="password"], select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 13px; background: var(--field); font-size: 16px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--azul-soft); }
.segs { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px 20px; }
@media (max-width: 420px) { .segs { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 5px; }
.seg button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--field); cursor: pointer; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg-lbl { color: var(--ink); font-weight: 600; margin-left: 4px; text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); background: var(--field); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .84rem; }
.chip[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #20232A; font-weight: 600; }
.chips.cata { flex-direction: column; gap: 6px; }
.cata-g { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip.cat { font-weight: 700; }
.rngs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 18px; }
.rng { display: flex; align-items: center; gap: 10px; }
.rng input { flex: 1; accent-color: var(--ink); min-width: 0; }
.rng output { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; min-width: 2.6em; text-align: right; }
.tgl { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 0; }
.tgl input { width: 20px; height: 20px; accent-color: var(--ink); }
.din { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.din-rows { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.din-row { display: flex; gap: 6px; align-items: center; width: 100%; }
.din-row input[type="text"], .din-row input[type="number"] { min-width: 60px; flex: 1; padding: 9px 10px; font-size: .9rem; }
.din-chk { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: .9rem; padding: 0 6px; }
.din-x { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid var(--line-2); background: var(--field); cursor: pointer; color: var(--muted); }
@media (max-width: 600px) { .din-row { flex-wrap: wrap; } .din-row input[type="text"], .din-row input[type="number"] { flex: 1 1 40%; } }
.form-acc { display: flex; gap: 10px; flex-wrap: wrap; position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); background: var(--surface); padding-top: 10px; }
@media (max-width: 899px) { .form-acc { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); } }
.form-acc.col { position: static; flex-direction: column; align-items: stretch; }
.form-acc.static { position: static; }

/* ---------- Lecturas ---------- */
.lecturas { display: flex; flex-wrap: wrap; gap: 10px; }
.lectura { flex: 1 1 140px; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.lec-et { font-size: .64rem; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); font-weight: 500; }
.lec-v { font-family: var(--font-num); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.lec-u { font-size: .76rem; color: var(--muted); }
.lectura .pill { align-self: flex-start; margin-top: 4px; }
.sticky-lec { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); z-index: 5; background: var(--surface); padding-block: 6px; }
.codigo { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); }
.codigo b { font-family: var(--font-num); font-size: 1.2rem; font-weight: 600; color: var(--ink); letter-spacing: .06em; overflow-wrap: anywhere; }

/* ---------- Detalles ---------- */
.det-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.det-h h2 { font-size: 2rem; font-weight: 500; overflow-wrap: anywhere; }
.sync-info { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 100%; }
.sync-info small { color: var(--muted); font-size: .74rem; overflow-wrap: anywhere; text-align: right; }
.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 20px; margin: 0; background: var(--surface); border: 0; border-radius: var(--r); padding: 16px 18px; }
.datos:empty { display: none; }
.datos dt { font-size: .64rem; color: var(--muted); text-transform: uppercase; letter-spacing: .2em; font-weight: 500; }
.datos dd { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; }
.bloque { background: var(--surface); border: 0; border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bloque summary { cursor: pointer; font-weight: 600; }
.bloque ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.pre { white-space: pre-line; }
.barras { display: flex; flex-direction: column; gap: 8px; }
.b-row { display: grid; grid-template-columns: minmax(110px, 140px) 1fr 2.4em; gap: 10px; align-items: center; font-size: .88rem; }
.b-track { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.b-fill { display: block; height: 100%; background: var(--ink); border-radius: 6px; }
.b-fill.alt { background: var(--azul); }
.b-row b { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.det-acc { display: flex; gap: 10px; flex-wrap: wrap; }
.tabla { overflow-x: auto; max-width: 100%; }
.tabla table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tabla th, .tabla td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla th { font-size: .64rem; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
.nota-proto { font-size: .86rem; padding: 12px 16px; border-radius: 14px; background: var(--accent-soft); }
.refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.ref-card { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 0; border-radius: 14px; background: var(--bg); align-items: flex-start; }
.ref-card small { color: var(--muted); font-size: .76rem; }
.ref-card .btn { margin-top: 6px; }

/* ---------- Visita de finca ---------- */
.visita-cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.areas { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.area-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.area-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.area-h h3, .rubrica h3 { display: flex; align-items: center; gap: 10px; }
.num { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--font-num); font-size: .78rem; font-weight: 600; align-items: center; justify-content: center; flex: none; }
.area-card details { font-size: .85rem; color: var(--muted); }
.area-card details p { margin-top: 4px; }
.rub { margin: 6px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.rub b { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--ink); align-items: center; justify-content: center; font-family: var(--font-num); font-size: .72rem; margin-right: 6px; }
.resumen-vivo { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.radar { width: 100%; height: auto; display: block; }
.visita-res { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 20px; align-items: center; background: var(--surface); border: 0; border-radius: var(--r); padding: 18px; }
.det-acc.arriba { justify-content: flex-start; }
@media (max-width: 899px) {
  .visita-cols { grid-template-columns: 1fr; }
  .resumen-vivo { position: static; order: -1; }
  .visita-res { grid-template-columns: 1fr; }
}

/* ---------- Informe ---------- */
.inf-layout { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
.inf-tools { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow: auto; }
.ia { display: flex; gap: 8px; flex-wrap: wrap; }
.papel { background: #FFFFFF; border-radius: var(--r); padding: 24px; box-shadow: var(--shadow); overflow-x: auto; min-width: 0; color: #20232A; }
@media (max-width: 1000px) { .inf-layout { grid-template-columns: 1fr; } .inf-tools { position: static; max-height: none; } .papel { padding: 14px; } }

/* ---------- Diagnóstico con foto ---------- */
.tipos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.tipo-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 18px; border-radius: var(--r); border: 0; background: var(--surface); cursor: pointer; }
.tipo-card b { font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; color: var(--head); }
.tipo-card small { color: var(--muted); font-size: .8rem; }
.tipo-card:hover { background: var(--accent-soft); }
.fotos-zona { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px dashed var(--line-2); border-radius: 16px; background: var(--bg); }
.fotos-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.fotos-btns .btn { flex: 1 1 180px; }
.miniaturas { display: flex; gap: 10px; flex-wrap: wrap; }
.miniaturas:empty { display: none; }
.mini { position: relative; margin: 0; width: 104px; height: 104px; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini .din-x { position: absolute; top: 5px; right: 5px; width: 28px; height: 28px; background: rgba(32, 35, 42, .7); color: #fff; border: 0; }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.galeria:empty { display: none; }
.galeria img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 18px; background: var(--surface-2); display: block; }
.resultado { background: var(--surface); border: 0; border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.resultado ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.diag-principal h3 { font-size: 1.6rem; font-weight: 500; margin-top: 4px; }
.chips-est { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.sync-card.analizando { flex-direction: row; align-items: center; gap: 22px; }

/* ---------- Aprende ---------- */
.tuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.tut { background: var(--surface); border: 0; border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.tut ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.manuales { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.manual-card { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 22px; border-radius: var(--r); border: 0; background: var(--hero-bg) var(--patron) center / 1600px; cursor: pointer; }
.manual-card b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 500; color: var(--head); }
.manual-card small { color: var(--muted); }
.manual-card:hover { box-shadow: var(--shadow); }
.manual-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: flex; flex-direction: column; gap: 8px; font-size: .84rem; }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--ink); }
.manual { background: var(--surface); border: 0; border-radius: var(--r); padding: 26px clamp(18px, 3vw, 40px); min-width: 0; }
.manual > * + * { margin-top: 12px; }
.manual h2 { font-size: 2rem; font-weight: 500; }
.manual h3 { font-size: 1.35rem; font-weight: 500; margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line-2); scroll-margin-top: 86px; }
.manual h4 { font-size: 1rem; margin-top: 16px; scroll-margin-top: 86px; }
.manual p, .manual li { max-width: 72ch; }
.manual ul, .manual ol { padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.manual blockquote { margin: 12px 0; padding: 12px 16px; border-left: 3px solid var(--ink); background: var(--accent-soft); border-radius: 10px; }
.manual hr { border: 0; border-top: 1px solid var(--line-2); }
.manual .tabla table { font-size: .86rem; }
@media (max-width: 899px) { .manual-layout { grid-template-columns: 1fr; } .toc { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px 14px; } }
.rubricas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.rubrica { background: var(--surface); border: 0; border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
.rubrica ul { margin: 4px 0 0; padding-left: 18px; }
.refs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.refs-grid ul { margin: 0; padding-left: 18px; }

/* ---------- Sincronización y ajustes ---------- */
.sync { display: flex; flex-direction: column; gap: 16px; max-width: 760px; }
.sync-card { background: var(--surface); border: 0; border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.sync-card .lecturas { width: 100%; }
.sync-estado p { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sync-estado p.help { display: block; }

/* ---------- Avisos flotantes ---------- */
#toasts { position: fixed; z-index: 50; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
@media (max-width: 899px) { #toasts { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); } }
.toast { padding: 13px 18px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: var(--shadow); transition: opacity .4s, transform .4s; }
.toast .btn { margin-left: 8px; min-height: 32px; background: var(--bg); color: var(--ink); border-color: var(--bg); }
.toast.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.toast.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.toast.out { opacity: 0; transform: translateY(6px); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- Impresión: solo el informe ---------- */
@media print {
  @page { margin: 12mm; }
  html, body { background: #FFFFFF !important; }
  .top, .nav, #toasts, .inf-tools, .volver, .aviso { display: none !important; }
  .shell, main.wrap, .contenido, .inf-layout { display: block !important; padding: 0 !important; margin: 0 !important; max-width: none !important; }
  .papel { box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; overflow: visible !important; }
}
</style>

    <b>Brewer Lab</b>
  </button>
  <div class="top-acc">
    <span class="red on" id="estado-red" role="status" title="En línea"><span class="txt">En línea</span></span>
    <button type="button" class="icono" id="btn-instalar" data-act="instalar" aria-label="Instalar la app" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span class="txt">Instalar</span>
    </button>
    <button type="button" class="icono" id="btn-sync" data-tab="sync" aria-label="Sincronizar con Obsidian">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
      <span class="txt">Sincronizar</span><span class="badge" id="sync-n" hidden>0</span>
    </button>
    <button type="button" class="icono" data-tab="ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="txt">Ajustes</span>
    </button>
  </div>
</header>
<div class="shell">
  <nav class="nav" aria-label="Secciones">
    <button type="button" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Inicio</button>
    <button type="button" data-tab="barista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2.5c0 1.5 1 1.5 1 3M12 2.5c0 1.5 1 1.5 1 3"/></svg>Barista</button>
    <button type="button" data-tab="cata"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="9" cy="8" rx="5" ry="3.5"/><path d="M13.5 9.5 21 19"/></svg>Cata</button>
    <button type="button" data-tab="foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button>
    <button type="button" data-tab="fincas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 14c0-3-2.5-5-7-5 0 4 2.5 5 7 5z"/></svg>Fincas</button>
    <button type="button" data-tab="aprende"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Aprende</button>
  </nav>
  <main class="wrap"><div class="contenido" id="main" aria-live="polite"><div class="cargando"><div class="taza" aria-hidden="true"></div><p>Abriendo tu laboratorio…</p></div></div></main>
</div>
