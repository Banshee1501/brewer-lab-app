<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewer Lab</title>
<meta name="description" content="Laboratorio de café: bitácora de preparaciones, recetas, cata SCA CVA, consultoría de fincas y diagnóstico con foto e IA. Funciona sin conexión.">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brewer Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" crossorigin="anonymous">
<style>
/* Concepto: cuaderno de laboratorio de café. Barra lateral en escritorio, barra inferior en el celular, lecturas tipo instrumento en mono. */
:root {
  --bg: #F2F3EF;          /* porcelana de taza de cata */
  --surface: #FFFFFF;
  --surface-2: #E8EBE4;
  --ink: #1C1A17;         /* espresso */
  --muted: #5E625A;
  --line: #D6DAD0;
  --accent: #2E6B5E;      /* café verde (oro) */
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAE5;
  --cherry: #A62639;      /* cereza madura */
  --ok: #2F7A4C; --ok-soft: #DCEFE2;
  --warn: #8A5A0E; --warn-soft: #F6E8C8;
  --bad: #B42318; --bad-soft: #F7DEDA;
  --shadow: 0 1px 2px rgba(28, 26, 23, .06), 0 8px 24px rgba(28, 26, 23, .06);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121412; --surface: #1A1D1A; --surface-2: #242823; --ink: #ECEEE8; --muted: #A4A99F; --line: #323830;
    --accent: #7CC3AF; --accent-ink: #0D1A16; --accent-soft: #1F3B34; --cherry: #E57886;
    --ok: #6CC791; --ok-soft: #1D3527; --warn: #E6B45E; --warn-soft: #3A2F17; --bad: #F2877B; --bad-soft: #3E1F1C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121412; --surface: #1A1D1A; --surface-2: #242823; --ink: #ECEEE8; --muted: #A4A99F; --line: #323830;
  --accent: #7CC3AF; --accent-ink: #0D1A16; --accent-soft: #1F3B34; --cherry: #E57886;
  --ok: #6CC791; --ok-soft: #1D3527; --warn: #E6B45E; --warn-soft: #3A2F17; --bad: #F2877B; --bad-soft: #3E1F1C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 62ch; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Estructura ---------- */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line); }
.marca { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; }
.marca b { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.marca svg { width: 30px; height: 30px; flex: none; }
.top-acc { display: flex; gap: 8px; align-items: center; }
.icono { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; }
.icono svg { width: 18px; height: 18px; }
.icono[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--cherry); color: var(--bg); font-size: .72rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); }
.red { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.red::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.red.off { color: var(--warn); }
.red.off::before { background: var(--warn); }
.shell { display: flex; align-items: flex-start; }
.nav { display: flex; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; border-radius: 10px; padding: 10px 12px; color: var(--muted); font-weight: 600; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
main.wrap { flex: 1; min-width: 0; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.contenido { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 900px) {
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); flex-direction: column; width: 200px; padding: 20px 0 20px max(16px, env(safe-area-inset-left, 0px)); flex: none; }
}
@media (max-width: 899px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--line);
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .nav button { flex-direction: column; gap: 2px; font-size: .68rem; padding: 6px 2px; flex: 1; min-width: 0; }
  main.wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .icono { padding: 0 10px; }
  .icono .txt, .red .txt { display: none; }
}
@media (max-width: 380px) { .marca b { font-size: 1.05rem; } .marca { gap: 8px; } .top-acc { gap: 6px; } }

/* ---------- Elementos ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { min-height: 32px; padding: 4px 12px; font-size: .88rem; }
.btn.big { min-height: 50px; padding: 10px 26px; font-size: 1.05rem; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 4px 0; min-height: 0; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.score { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.score.warn { background: var(--warn-soft); color: var(--warn); } .score.bad { background: var(--bad-soft); color: var(--bad); }
.estrellas { color: var(--cherry); letter-spacing: 1px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; flex: none; }
.aviso { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: .9rem; }
.aviso.suave { background: var(--accent-soft); color: var(--accent); }
.volver { align-self: flex-start; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }

.hero { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.025em; }
.rapidas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.rapida { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; text-align: left; }
.rapida svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
.rapida:hover { border-color: var(--accent); }
.guia-inicio ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: left; }
.stat span { font-size: .78rem; color: var(--muted); font-weight: 600; }
.stat b { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat small { font-size: .75rem; color: var(--muted); min-height: 1em; }
.stat-sync { cursor: pointer; border-color: color-mix(in srgb, var(--cherry) 35%, var(--line)); }
.dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.dos > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-h h2 { font-size: 1.1rem; }
.barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.barra-acc { display: flex; gap: 8px; flex-wrap: wrap; }
.subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; color: var(--muted); }
.subtabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.filas { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; }
.fila:last-child { border-bottom: 0; }
.fila:hover { background: var(--surface-2); }
.fila.estatica { cursor: default; }
.fila-txt { display: flex; flex-direction: column; min-width: 0; }
.fila-txt b { font-weight: 650; overflow-wrap: anywhere; }
.fila-txt small { color: var(--muted); font-size: .84rem; overflow-wrap: anywhere; }
.fila-der { display: flex; align-items: center; gap: 8px; flex: none; }
.vacio { border: 1px dashed var(--line); border-radius: var(--r); padding: 26px 18px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--muted); background: var(--surface); }
.vacio-t { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--ink); }
.cargando { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 0; color: var(--muted); }
.taza { width: 46px; height: 34px; border: 3px solid var(--accent); border-top: 0; border-radius: 0 0 22px 22px; position: relative; flex: none; }
.taza::before { content: ""; position: absolute; left: 12px; top: -18px; width: 4px; height: 12px; border-radius: 4px; background: var(--accent); opacity: .5; animation: vapor 1.4s ease-in-out infinite; }
.taza::after { content: ""; position: absolute; right: -14px; top: 4px; width: 12px; height: 14px; border: 3px solid var(--accent); border-left: 0; border-radius: 0 10px 10px 0; }
@keyframes vapor { 0%, 100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(-6px); opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .taza::before { animation: none; } }

/* ---------- Formularios ---------- */
.form { display: flex; flex-direction: column; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.form details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.form details ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 700; padding: 0 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.grid.g3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid.g4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.grid > * { min-width: 0; }
@media (min-width: 700px) { .span2 { grid-column: span 2; } }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label { font-weight: 600; font-size: .88rem; }
.fld > label small { color: var(--muted); font-weight: 500; }
.help { font-size: .78rem; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="password"], select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); font-size: 16px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.segs { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px 18px; }
@media (max-width: 420px) { .segs { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-family: var(--font-mono); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg-lbl { color: var(--accent); font-weight: 600; margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .86rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips.cata { flex-direction: column; gap: 6px; }
.cata-g { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip.cat { font-weight: 700; }
.rngs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 18px; }
.rng { display: flex; align-items: center; gap: 10px; }
.rng input { flex: 1; accent-color: var(--accent); min-width: 0; }
.rng output { font-family: var(--font-mono); font-weight: 600; min-width: 2.6em; text-align: right; }
.tgl { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 0; }
.tgl input { width: 20px; height: 20px; accent-color: var(--accent); }
.din { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.din-rows { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.din-row { display: flex; gap: 6px; align-items: center; width: 100%; }
.din-row input[type="text"], .din-row input[type="number"] { min-width: 60px; flex: 1; padding: 8px 9px; font-size: .9rem; }
.din-chk { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: .9rem; padding: 0 6px; }
.din-x { width: 32px; height: 32px; flex: none; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; color: var(--muted); }
@media (max-width: 600px) { .din-row { flex-wrap: wrap; } .din-row input[type="text"], .din-row input[type="number"] { flex: 1 1 40%; } }
.form-acc { display: flex; gap: 10px; flex-wrap: wrap; position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); background: var(--surface); padding-top: 8px; }
@media (max-width: 899px) { .form-acc { bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); } }
.form-acc.col { position: static; flex-direction: column; align-items: stretch; }
.form-acc.static { position: static; }

/* ---------- Lecturas tipo instrumento ---------- */
.lecturas { display: flex; flex-wrap: wrap; gap: 10px; }
.lectura { flex: 1 1 140px; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.lec-et { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.lec-v { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.lec-u { font-size: .78rem; color: var(--muted); }
.lectura .pill { align-self: flex-start; margin-top: 4px; }
.sticky-lec { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 5; background: var(--surface); padding-block: 6px; }
.codigo { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.codigo b { font-family: var(--font-mono); font-size: 1.25rem; color: var(--accent); overflow-wrap: anywhere; }

/* ---------- Detalles ---------- */
.det-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.det-h h2 { font-size: 1.6rem; font-weight: 800; overflow-wrap: anywhere; }
.sync-info { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 100%; }
.sync-info small { color: var(--muted); font-size: .76rem; overflow-wrap: anywhere; text-align: right; }
.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 18px; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.datos:empty { display: none; }
.datos dt { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.datos dd { margin: 0; font-weight: 550; overflow-wrap: anywhere; }
.bloque { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bloque summary { cursor: pointer; font-weight: 700; }
.bloque ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.pre { white-space: pre-line; }
.barras { display: flex; flex-direction: column; gap: 6px; }
.b-row { display: grid; grid-template-columns: minmax(110px, 140px) 1fr 2.4em; gap: 10px; align-items: center; font-size: .9rem; }
.b-track { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.b-fill { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.b-fill.alt { background: var(--cherry); }
.b-row b { font-family: var(--font-mono); text-align: right; }
.det-acc { display: flex; gap: 10px; flex-wrap: wrap; }
.tabla { overflow-x: auto; max-width: 100%; }
.tabla table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tabla th, .tabla td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla th { background: var(--bg); font-weight: 700; }
.nota-proto { font-size: .88rem; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); }
.refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.ref-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); align-items: flex-start; }
.ref-card small { color: var(--muted); font-family: var(--font-mono); font-size: .78rem; }
.ref-card .btn { margin-top: 6px; }

/* ---------- Visita de finca ---------- */
.visita-cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.areas { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.area-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.area-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.area-h h3, .rubrica h3 { display: flex; align-items: center; gap: 8px; }
.num { display: inline-flex; width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: .8rem; align-items: center; justify-content: center; flex: none; }
.area-card details { font-size: .86rem; color: var(--muted); }
.area-card details p { margin-top: 4px; }
.rub { margin: 6px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.rub b { display: inline-flex; width: 20px; height: 20px; border-radius: 6px; background: var(--surface-2); color: var(--ink); align-items: center; justify-content: center; font-family: var(--font-mono); font-size: .75rem; margin-right: 6px; }
.resumen-vivo { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.radar { width: 100%; height: auto; display: block; }
.visita-res { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.det-acc.arriba { justify-content: flex-start; }
@media (max-width: 899px) {
  .visita-cols { grid-template-columns: 1fr; }
  .resumen-vivo { position: static; order: -1; }
  .visita-res { grid-template-columns: 1fr; }
}

/* ---------- Informe ---------- */
.inf-layout { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 18px; align-items: start; }
.inf-tools { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto; }
.ia { display: flex; gap: 8px; flex-wrap: wrap; }
.papel { background: #FFFFFF; border-radius: var(--r); padding: 24px; box-shadow: var(--shadow); overflow-x: auto; min-width: 0; color: #1D1A16; }
@media (max-width: 1000px) { .inf-layout { grid-template-columns: 1fr; } .inf-tools { position: static; max-height: none; } .papel { padding: 14px; } }

/* ---------- Diagnóstico con foto ---------- */
.tipos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.tipo-card { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.tipo-card b { font-family: var(--font-display); font-size: 1.05rem; }
.tipo-card small { color: var(--muted); font-size: .82rem; }
.tipo-card:hover { border-color: var(--accent); }
.fotos-zona { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); }
.fotos-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.fotos-btns .btn { flex: 1 1 180px; }
.miniaturas { display: flex; gap: 10px; flex-wrap: wrap; }
.miniaturas:empty { display: none; }
.mini { position: relative; margin: 0; width: 104px; height: 104px; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini .din-x { position: absolute; top: 4px; right: 4px; background: rgba(0, 0, 0, .6); color: #fff; border: 0; }
.galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.galeria:empty { display: none; }
.galeria img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--surface-2); display: block; }
.resultado { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.resultado ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.diag-principal h3 { font-size: 1.35rem; margin-top: 2px; }
.chips-est { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.sync-card.analizando { flex-direction: row; align-items: center; gap: 22px; }

/* ---------- Aprende ---------- */
.tuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.tut { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.tut ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
.manuales { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.manual-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.manual-card b { font-family: var(--font-display); font-size: 1.2rem; }
.manual-card small { color: var(--muted); }
.manual-card:hover { border-color: var(--accent); }
.manual-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 6px; font-size: .86rem; }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--accent); }
.manual { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px clamp(16px, 3vw, 36px); min-width: 0; }
.manual > * + * { margin-top: 12px; }
.manual h2 { font-size: 1.7rem; font-weight: 800; }
.manual h3 { font-size: 1.2rem; margin-top: 24px; padding-top: 10px; border-top: 1px solid var(--line); scroll-margin-top: 80px; }
.manual h4 { font-size: 1rem; margin-top: 16px; scroll-margin-top: 80px; }
.manual p, .manual li { max-width: 72ch; }
.manual ul, .manual ol { padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.manual blockquote { margin: 12px 0; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 8px; }
.manual hr { border: 0; border-top: 1px solid var(--line); }
.manual .tabla table { font-size: .88rem; }
@media (max-width: 899px) { .manual-layout { grid-template-columns: 1fr; } .toc { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px 12px; } }
.rubricas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.rubrica { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.rubrica ul { margin: 4px 0 0; padding-left: 18px; }
.refs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.refs-grid ul { margin: 0; padding-left: 18px; }

/* ---------- Sincronización y ajustes ---------- */
.sync { display: flex; flex-direction: column; gap: 14px; max-width: 760px; }
.sync-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.sync-card .lecturas { width: 100%; }
.sync-estado p { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sync-estado p.help { display: block; }
#main > .form + .form, #main > .form + .bloque, #main > .bloque + .bloque { margin-top: 0; }

/* ---------- Avisos flotantes ---------- */
#toasts { position: fixed; z-index: 50; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
@media (max-width: 899px) { #toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); } }
.toast { padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: var(--shadow); transition: opacity .4s, transform .4s; }
.toast .btn { margin-left: 8px; min-height: 30px; }
.toast.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.toast.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.toast.out { opacity: 0; transform: translateY(6px); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- Impresión: solo el informe ---------- */
@media print {
  @page { margin: 12mm; }
  html, body { background: #FFFFFF !important; }
  .top, .nav, #toasts, .inf-tools, .volver, .aviso { display: none !important; }
  .shell, main.wrap, .contenido, .inf-layout { display: block !important; padding: 0 !important; margin: 0 !important; max-width: none !important; }
  .papel { box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; overflow: visible !important; }
}
</style>
